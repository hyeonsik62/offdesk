<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1400">
    <title>offdesk</title>
    <link rel="stylesheet" href="../css/loginpage.css">
    <link rel="icon" href="../images/offdesk_favicon.ico">
</head>

<body>
    <div id="login_section_wrap">
        <div class="login_images_contents">
            <img src="../images/loginpage/login_section_img.png" alt="login_section_img" width="960px" height="960px"
                style="opacity: 0.7;">
            <h2>offdesk</h2>
            <p>
                Get off you desk, <br>
                return to you room
            </p>
        </div>
        <div class="login_contents">
            <h2>Sign into offdesk</h2>
            <form action="#" method="POST" class="login_form">
                <h3>User name</h3>
                <input type="id" placeholder="ID" class="login_input">
                <h3>Password</h3>
                <input type="password" placeholder="PASSWORD" class="password_input">
            </form>

            <div class="login_util">
                <a href="#">
                    <h4>Sign up</h4>
                </a>
                <a href="#">
                    <h4>Forgot your password</h4>
                </a>

            </div>
            <div class="login_button">
                <a href="#" class="login_button">Login</a>
            </div>
            <div class="otherlogin_link">
                <a href="#">
                    <img src="../images/loginpage/Naver_icon 1.png" alt="Naver_icon">
                </a>
                <a href="#">
                    <img src="../images/loginpage/Kakaotalk_icon 1.png" alt="Kakaotalk_icon">
                </a>
                <a href="#">
                    <img src="../images/loginpage/Google_icon 1.png" alt="Google_icon" width="40px">
                </a>
            </div>
        </div>

    </div>
</body>

</html>
